# git-cliff configuration for release-plz changelog generation
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/resq-software/crates
{%- endmacro -%}

{% if version -%}
    ## [{{ version }}]({{ self::remote_url() }}/releases/tag/{{ package }}-v{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.github.pr_number }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
# No literal `\n` after that final `{% endfor %}`. With it, a rendered section
# ended in `\n\n\n` — the content plus TWO blank lines. release-plz prepends a
# rendered section above the existing one, so every release inserted two blank
# lines at the join, and the file then never matched a fresh render: release-plz
# proposed a "fix" that added two more. PR #245 was exactly that — a +2/-0 diff
# of nothing but whitespace — and it would have recurred indefinitely.
#
# Without it the section ends `\n\n`, one blank line and the ordinary Markdown
# separator, and re-rendering is byte-identical. Verified against this config
# with git-cliff 2.14.2: two consecutive renders hash the same.
#
# This is the SECOND pump behind one loop. #243 stopped release commits being
# counted as releasable content; this stops the whitespace churn left behind.
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
# Inert under release-plz: it builds the release itself and calls git-cliff's
# changelog API, which never reads `tag_pattern` — only the git-cliff CLI's
# repo scan does. Corrected anyway so it describes the scheme release-plz
# actually tags with (`<crate>-v<semver>`, per its default `git_tag_name`)
# rather than a bare-`v` scheme this repo has never used.
tag_pattern = "^[a-z0-9-]+-v[0-9].*"
topo_order = false
sort_commits = "newest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^style", group = "Styling" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    # Skip release-plz's own release commits, or it releases its own releases.
    #
    # ONE pattern, because enumerating shapes is what broke this twice. The two
    # earlier entries were `^chore\(release\)` and `^chore: release`, and
    # release-plz now writes a PACKAGE scope — `chore(resq-cli): release v0.5.2`
    # — which neither matched. Every release commit then counted as a releasable
    # change and cut another release: v0.5.1 was published twice (#240, #241),
    # and #242 existed only to release the commit that released v0.5.1.
    #
    # The scope group is optional and its contents unconstrained, so a different
    # crate name — or no scope at all — stays matched without another edit.
    { message = "^chore(\\([^)]*\\))?: release", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", group = "Miscellaneous" },
]
