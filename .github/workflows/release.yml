name: release

on:
  push:
    tags:
      - 'resq-cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. resq-cli-v0.3.0)'
        required: true
      # Dispatch exists so the build can be exercised WITHOUT shipping, which
      # is exactly what it could not do before: `publish` had no event gate, so
      # every manual run created and published a release under whatever tag was
      # typed. The org enforces immutable releases, so that result cannot be
      # deleted — a single wrong dispatch was permanent.
      #
      # Defaults to true. The safe option has to be the one you get by pressing
      # "Run workflow" without reading anything.
      dry_run:
        description: 'Build only — do not create or publish a release'
        type: boolean
        default: true

permissions: {}

jobs:
  # The dispatch input is a free-text ref that reaches `actions/checkout` and,
  # on a publishing run, names the release that gets created. Any tag in the
  # repo satisfies it, so `resq-tui-v0.1.10` would build resq-cli binaries and
  # publish them under a TUI tag — and an immutable release cannot be taken
  # back. One cheap job, once, rather than the same check five times in the
  # matrix.
  guard:
    name: validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Tag must name a resq-cli release
        env:
          # Via env, never inlined into the script: ${{ }} interpolation happens
          # before the shell sees the line, so a crafted value would otherwise
          # be executed rather than compared.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            resq-cli-v*) printf 'ok  %s\n' "$TAG" ;;
            *)
              printf '::error::Refusing to build %s — this workflow releases resq-cli, and the tag must start with resq-cli-v.\n' "$TAG"
              exit 1
              ;;
          esac

  build:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # macOS x86_64 cross-built from the arm64 runner — no native Intel
          # runner is in the free pool any more (macos-13 was the last one).
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # REQUIRED when this action is pinned by SHA. Normally it takes the
          # toolchain from the ref name — dtolnay/rust-toolchain@stable means
          # "install stable". Pinning to a commit, which is right for an action
          # that compiles the binaries we ship, removes that signal, and the
          # action then demands the input explicitly:
          #
          #   env:
          #     toolchain:
          #   'toolchain' is a required input
          #
          # Without it every target fails at the first step. This workflow has
          # been red since 2026-04-14 for that reason alone, which is why no
          # resq-cli release has ever carried binaries.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (linux arm64)
        if: matrix.cross == true
        # SECURITY: pin the version. `cross` drives the actual compilation of the
        # distributed aarch64 binary *before* SHA256SUMS is computed, so a
        # malicious `cross` release would backdoor the artifact while end-user
        # checksum verification still passes. An unpinned install silently adopts
        # whatever version is newest at release time.
        run: cargo install cross --version 0.2.5 --locked

      - name: Build
        shell: bash
        env:
          USE_CROSS: ${{ matrix.cross }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --release -p resq-cli --target "$BUILD_TARGET"
          else
            cargo build --release -p resq-cli --target "$BUILD_TARGET"
          fi

      - name: Package
        id: pkg
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
          ARCHIVE_FMT: ${{ matrix.archive }}
          BUILD_TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bin="resq"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          staging="resq-cli-${TAG_NAME}-${BUILD_TARGET}"
          mkdir -p "$staging"
          cp "target/${BUILD_TARGET}/release/${bin}${ext}" "$staging/"
          cp README.md LICENSE* "$staging/" 2>/dev/null || true
          if [ "$ARCHIVE_FMT" = "zip" ]; then
            7z a "${staging}.zip" "$staging"
            echo "asset=${staging}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${staging}.tar.gz" "$staging"
            echo "asset=${staging}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: ${{ steps.pkg.outputs.asset }}
          retention-days: 7

  publish:
    name: publish release
    needs: build
    # Publishes on a tag push, or on a dispatch that explicitly asked for it.
    #
    # Both false forms are matched on purpose. `gh workflow run -f dry_run=false`
    # sends the value over the API as the STRING "false", and whether Actions
    # coerces that back to a boolean for the `inputs` context — given `type:
    # boolean` is declared — is inconsistent enough to be worth not betting a
    # release on. `github.event.inputs` is documented to stringify regardless.
    # Checking both costs one comparison; getting it wrong means release-plz
    # dispatches, five targets build green, and nothing is ever published.
    #
    # The event check stays first because `inputs` is undefined on a push: `||`
    # returns the first truthy operand, so that case never evaluates an input.
    #
    # Note the asymmetry — a wrong answer here fails in the safe direction
    # (nothing ships) but silently, which is why it is spelled out rather than
    # left to coercion.
    if: >-
      ${{ github.event_name == 'push'
          || inputs.dry_run == false
          || inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      # Create as DRAFT first, upload assets, THEN publish. The org
      # enforces "immutable releases", which means a release is locked the
      # moment it's published — so assets must be attached while still
      # draft. release-plz.toml is configured to skip git_release for
      # resq-cli specifically, so this workflow owns the release lifecycle
      # end-to-end and never collides with release-plz's release object.
      - name: Create + upload + publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist

          # If a release already exists (e.g. from a prior failed run that
          # left a draft, or if release-plz git_release_enable was flipped
          # back on), delete it so we start clean. Immutable-published
          # releases can't be deleted — in that case we bail loudly.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$is_draft" = "true" ]; then
              echo "→ deleting existing draft $TAG to start clean"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "::error::Release $TAG already exists and is published (immutable). Cannot re-upload assets. Cut a new tag."
              exit 1
            fi
          fi

          echo "→ creating draft release $TAG with assets"
          # Notes kept single-line: YAML block scalars treat any line at
          # column 0 (including blank lines inside a multi-line `--notes`
          # value) as terminating the block.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --notes "Binary build for $TAG. Cross-platform resq CLI binaries + SHA256SUMS. Verify with: sha256sum -c SHA256SUMS" \
            -- *

          echo "→ publishing release $TAG (becomes immutable)"
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false