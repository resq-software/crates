name: Release-plz

on:
  # The canonical release-plz trigger, and the one this pipeline actually
  # needs. `release-plz release` publishes whatever is unpublished at the
  # checked-out HEAD; merging the "chore: release" PR is just a push to
  # master, so with no push trigger that merge produced no workflow run at
  # all and nothing shipped until the next cron. That is exactly what
  # happened to #200.
  push:
    branches:
      - master
  # Retained as a retry net, not the primary path: if a push-triggered run
  # dies part-way (registry outage, cancelled runner), the next cron re-runs
  # and publishes the remainder without anyone noticing. Safe to leave on
  # because `release` is idempotent — with every package already published
  # it does nothing. Scheduled runs are best-effort and have drifted by
  # hours here, so they must not be the only path.
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger for on-demand releases
  workflow_dispatch:

# Publishing to crates.io cannot be undone and GitHub releases are immutable
# here, so releases are serialised and NEVER cancelled mid-flight. Upstream
# warns that squash-merging a PR while `release-plz release` is still running
# races; this repo squash-merges (auto-merge.yml), so the window is real.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required to dispatch release.yml below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do NOT persist credentials in .git/config — release-plz-action
          # reads GITHUB_TOKEN from the env block below for git push and API
          # calls, so persisting credentials only widens the leak surface
          # (zizmor artipacked audit).
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - id: release-plz
        uses: MarcoIeni/release-plz-action@d6c56271d640b6c1b61d1e00593641c400a9f4bd # v0.5.138
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Tags pushed by this job run under GITHUB_TOKEN, which by design
      # does NOT trigger downstream `on: push: tags:` workflows. Read the
      # action's `releases` JSON output and dispatch release.yml explicitly
      # for each newly-cut resq-cli-v* tag — workflow_dispatch IS allowed
      # from GITHUB_TOKEN, so the hop works without a PAT.
      - name: Dispatch release.yml for new binary-crate tags
        # `releases` is the JSON output and is the literal string "[]" when
        # nothing was released — non-empty, so the old `!= ''` guard was
        # always true and this step ran on every no-op. `releases_created`
        # is the purpose-built boolean.
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          # Must match release.yml's `guard` allowlist and the crates carrying
          # `git_release_enable = false` in release-plz.toml. A crate missing
          # here gets a tag and a bare release with no binaries; a crate here
          # but not in release-plz.toml gets its release published by
          # release-plz first, and release.yml then fails loudly because an
          # immutable release cannot take new assets.
          echo "$RELEASES" \
            | jq -r '.[]
                | select(.package_name
                    | IN("resq-cli", "resq-bin", "resq-clean", "resq-flame", "resq-perf"))
                | .tag' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "→ dispatching release.yml for tag=$tag"
                # dry_run=false is REQUIRED here, not decorative. release.yml
                # defaults it to true so that a human pressing "Run workflow"
                # cannot accidentally publish an immutable release. This
                # dispatch is the one caller that genuinely means to publish —
                # and because the tag above was pushed by GITHUB_TOKEN, the
                # `on: push: tags:` path never fires, so this is the ONLY way a
                # resq-cli release is ever produced. Omitting it would take the
                # safe default and silently ship nothing: five green builds and
                # no release.
                gh workflow run release.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  -f tag="$tag" \
                  -f dry_run=false
              done
