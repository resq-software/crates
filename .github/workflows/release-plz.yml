name: Release-plz

on:
  # Weekly release check — every Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger for on-demand releases
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required to dispatch release.yml below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do NOT persist credentials in .git/config — release-plz-action
          # reads GITHUB_TOKEN from the env block below for git push and API
          # calls, so persisting credentials only widens the leak surface
          # (zizmor artipacked audit).
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - id: release-plz
        uses: MarcoIeni/release-plz-action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Tags pushed by this job run under GITHUB_TOKEN, which by design
      # does NOT trigger downstream `on: push: tags:` workflows. Read the
      # action's `releases` JSON output and dispatch release.yml explicitly
      # for each newly-cut resq-cli-v* tag — workflow_dispatch IS allowed
      # from GITHUB_TOKEN, so the hop works without a PAT.
      - name: Dispatch release.yml for new resq-cli-v* tags
        if: steps.release-plz.outputs.releases != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          echo "$RELEASES" \
            | jq -r '.[] | select(.package_name == "resq-cli") | .tag' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "→ dispatching release.yml for tag=$tag"
                # dry_run=false is REQUIRED here, not decorative. release.yml
                # defaults it to true so that a human pressing "Run workflow"
                # cannot accidentally publish an immutable release. This
                # dispatch is the one caller that genuinely means to publish —
                # and because the tag above was pushed by GITHUB_TOKEN, the
                # `on: push: tags:` path never fires, so this is the ONLY way a
                # resq-cli release is ever produced. Omitting it would take the
                # safe default and silently ship nothing: five green builds and
                # no release.
                gh workflow run release.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  -f tag="$tag" \
                  -f dry_run=false
              done
