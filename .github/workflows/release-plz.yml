name: Release-plz

on:
  # The canonical release-plz trigger, and the one this pipeline actually
  # needs. `release-plz release` publishes whatever is unpublished at the
  # checked-out HEAD; merging the "chore: release" PR is just a push to
  # master, so with no push trigger that merge produced no workflow run at
  # all and nothing shipped until the next cron. That is exactly what
  # happened to #200.
  push:
    branches:
      - master
  # Retained as a retry net, not the primary path: if a push-triggered run
  # dies part-way (registry outage, cancelled runner), the next cron re-runs
  # and publishes the remainder without anyone noticing. Safe to leave on
  # because `release` is idempotent — with every package already published
  # it does nothing. Scheduled runs are best-effort and have drifted by
  # hours here, so they must not be the only path.
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger for on-demand releases
  workflow_dispatch:

# Publishing to crates.io cannot be undone and GitHub releases are immutable
# here, so releases are serialised and NEVER cancelled mid-flight. Upstream
# warns that squash-merging a PR while `release-plz release` is still running
# races; this repo squash-merges (auto-merge.yml), so the window is real.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required to dispatch release.yml below
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do NOT persist credentials in .git/config — release-plz-action
          # reads GITHUB_TOKEN from the env block below for git push and API
          # calls, so persisting credentials only widens the leak surface
          # (zizmor artipacked audit).
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - id: release-plz
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Tags pushed by this job run under GITHUB_TOKEN, which by design
      # does NOT trigger downstream `on: push: tags:` workflows. Read the
      # action's `releases` JSON output and dispatch release.yml explicitly
      # for each newly-cut resq-cli-v* tag — workflow_dispatch IS allowed
      # from GITHUB_TOKEN, so the hop works without a PAT.
      - name: Dispatch release.yml for new binary-crate tags
        # `releases` is the JSON output and is the literal string "[]" when
        # nothing was released — non-empty, so the old `!= ''` guard was
        # always true and this step ran on every no-op. `releases_created`
        # is the purpose-built boolean.
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          # Must match release.yml's `guard` allowlist and the crates carrying
          # `git_release_enable = false` in release-plz.toml. A crate missing
          # here gets a tag and a bare release with no binaries; a crate here
          # but not in release-plz.toml gets its release published by
          # release-plz first, and release.yml then fails loudly because an
          # immutable release cannot take new assets.
          echo "$RELEASES" \
            | jq -r '.[]
                | select(.package_name
                    | IN("resq-cli", "resq-bin", "resq-clean", "resq-flame", "resq-perf"))
                | .tag' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "→ dispatching release.yml for tag=$tag"
                # dry_run=false is REQUIRED here, not decorative. release.yml
                # defaults it to true so that a human pressing "Run workflow"
                # cannot accidentally publish an immutable release. This
                # dispatch is the one caller that genuinely means to publish —
                # and because the tag above was pushed by GITHUB_TOKEN, the
                # `on: push: tags:` path never fires, so this is the ONLY way a
                # resq-cli release is ever produced. Omitting it would take the
                # safe default and silently ship nothing: five green builds and
                # no release.
                #
                # --ref runs release.yml AT the tag, so its build provenance
                # names the tagged commit rather than whatever master is by
                # then. release.yml's guard refuses a publishing run without it.
                gh workflow run release.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref "$tag" \
                  -f tag="$tag" \
                  -f dry_run=false
              done

  # Provenance and an SBOM for the crates this run published to crates.io.
  # The binary releases get theirs in release.yml. This is its own job so the
  # job holding CARGO_REGISTRY_TOKEN never gains id-token: write. It runs
  # after publishing and nothing depends on it, so a failure here cannot
  # block or undo a release; it only leaves that version unattested.
  attest-crates:
    name: attest published crates
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # sign the provenance attestation (Sigstore OIDC)
      attestations: write  # record the attestation on this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Attest the exact bytes crates.io serves, not a local re-package that
      # might differ. A package whose manifest sets `publish = false` is
      # never on crates.io and is skipped. Any other package that cannot be
      # fetched fails the job (after the ones that were fetched are attested),
      # so a missing attestation is never silent.
      - name: Fetch the published .crate files
        id: fetch
        env:
          RELEASES: ${{ needs.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          mkdir -p published
          unpublishable=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == []) | .name')
          missing=""
          while read -r name version; do
            [ -z "$name" ] && continue
            if ! [[ "$name" =~ ^[A-Za-z0-9_-]+$ && "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
              echo "::error::unexpected package name or version: $name $version"
              exit 1
            fi
            if grep -qx -- "$name" <<<"$unpublishable"; then
              echo "::notice::${name} sets publish = false; nothing on crates.io to attest"
              continue
            fi
            file="published/${name}-${version}.crate"
            # crates.io can take a little while to serve a new upload, hence
            # the generous retry window.
            if curl -fsSL --retry 10 --retry-delay 15 --retry-all-errors \
                -o "$file" "https://static.crates.io/crates/${name}/${name}-${version}.crate"; then
              echo "fetched ${name}-${version}.crate"
            else
              rm -f "$file"
              echo "::error::${name} ${version} was published but its .crate could not be fetched"
              missing="${missing} ${name}-${version}"
            fi
          done < <(printf '%s' "$RELEASES" | jq -r '.[] | "\(.package_name) \(.version)"')
          ls -l published
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: crates.spdx.json
          # Kept as a workflow artifact: release-plz publishes the library
          # releases immutably, so nothing can be attached to them afterwards.
          artifact-name: crates.spdx.json
          upload-release-assets: false

      - name: Attest build provenance
        if: hashFiles('published/*.crate') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: published/*.crate

      - name: Fail if any published crate went unattested
        if: steps.fetch.outputs.missing != ''
        env:
          MISSING: ${{ steps.fetch.outputs.missing }}
        run: |
          echo "::error::No provenance for: ${MISSING}. Re-run this job once crates.io serves them."
          exit 1
