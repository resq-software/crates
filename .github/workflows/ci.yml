#
# Thin CI wrapper. Dispatches to the org-wide reusable rust-ci workflow
# (fmt + clippy + test + coverage + cargo-deny). Subsumes clippy.yml and
# deny.yml (both removed in the same PR). Security scanning stays in
# security.yml.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: resq-software/.github/.github/workflows/rust-ci.yml@5261ae18b661fcfc4afb4e84b88565d4e7791a7f
    with:
      toolchain: stable
      run-fmt: true
      run-clippy: true
      run-test: true
      run-deny: true
      run-coverage: true
    secrets: inherit # zizmor: ignore[secrets-inherit] — org-internal reusable workflow

  # Guards resq-dsa's headline invariant: zero-dep + no_std. The org reusable
  # rust-ci workflow only builds with std, so an accidental `use std::` or a
  # float method that needs libm would merge green and silently break the crate's
  # value proposition, surfacing only at `cargo publish` or in an embedded
  # consumer. Both checks are `cargo check` (fast, no linking): the host build
  # catches std usage; the bare-metal target proves true core+alloc portability.
  no-std:
    name: resq-dsa no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust + bare-metal target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - name: resq-dsa compiles without std (host)
        run: cargo check -p resq-dsa --no-default-features
      - name: resq-dsa compiles for bare-metal (core + alloc only)
        run: cargo check -p resq-dsa --no-default-features --target thumbv7em-none-eabi

  # ── Private-name guard ──────────────────────────────────────────────
  # Called from here and not from security.yml: `needs:` cannot reach across
  # workflow files, and the org ruleset watches only the `required` context.
  # A guard that reports into nothing cannot stop a merge, however loudly it
  # fails.
  private-name-guard:
    name: private-name-guard
    # Dependabot's restricted context resolves Actions secrets to empty, so
    # the guard cannot authenticate on its pull requests. The aggregate below
    # tolerates the resulting skip, but only on a pull request Dependabot
    # actually opened.
    #
    # Both halves are tested, because github.actor does not mean "the author".
    # It names the account that triggered the run; on a re-run it stays as the
    # initial triggerer while github.triggering_actor names whoever pressed
    # the button. Nothing in it is pinned to who opened the pull request,
    # which is what this decision is actually about -- and zizmor's
    # bot-conditions audit flags comparing it against a bot name for that
    # reason. user.login on the pull_request payload IS the author, fixed at
    # trigger time, so the pair of them is what decides.
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          || github.event.pull_request.user.login != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/private-name-guard.yml@df80d139e942121d69697d02d3c0f59604842054 # main
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  # The job above skips Dependabot, because Dependabot's restricted context
  # resolves Actions secrets to empty and the guard cannot authenticate. This
  # job covers exactly that case and nothing else: it runs the guard ALONE on
  # Dependabot pull requests, where `secrets` resolves from the DEPENDABOT
  # store. An org-wide PRIVATE_NAME_GUARD_TOKEN is now provisioned there,
  # carrying the same Metadata: Read + Organization administration: Read the
  # reusable workflow asks for.
  #
  # It deliberately does not instead remove the skip from the job above. That
  # would be the smaller diff but the larger change: this repository's other
  # pull-request jobs would start running on every bump, which is a cost and
  # failure-surface decision separate from this disclosure gap.
  #
  # Worth closing because a lockfile is the likeliest carrier of a non-public
  # reference there is, and Dependabot pull requests are precisely the ones
  # that rewrite lockfiles. A tolerated skip meant the guard reported nothing
  # on exactly those changes -- a green run that never looked.
  #
  # Keyed on the pull request's author alone. user.login is fixed at trigger
  # time from the original author. github.actor names whoever triggered the
  # run and stays with the initial triggerer across a re-run, so it can read
  # dependabot[bot] on a pull request Dependabot did not open -- which is what
  # zizmor's bot-conditions audit objects to.
  private-name-guard-dependabot:
    name: private-name-guard (dependabot)
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/private-name-guard.yml@df80d139e942121d69697d02d3c0f59604842054 # main
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [rust, no-std, private-name-guard, private-name-guard-dependabot]
    if: always()
    steps:
      - name: Aggregate
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          NO_STD_RESULT: ${{ needs.no-std.result }}
          GUARD: ${{ needs.private-name-guard.result }}
          GUARD_DEPENDABOT: ${{ needs.private-name-guard-dependabot.result }}
        run: |
          set -eu
          fail=0
          for pair in "rust=$RUST_RESULT" "no-std=$NO_STD_RESULT"; do
            name="${pair%%=*}"
            res="${pair#*=}"
            case "$res" in
              success|skipped|"") echo "ok: $pair" ;;
              *) echo "::error::$name returned: $res"; fail=1 ;;
            esac
          done
          # Exactly one of the two guard jobs runs on any given event, and
          # whichever one ran must have SUCCEEDED.
          #
          # Nothing here is decided by who triggered the run any more. The
          # previous test accepted a SKIPPED guard whenever github.actor and
          # the pull request's author both read dependabot[bot] -- an actor's
          # claim standing in for a scan, because no scan was possible. One is
          # possible now, so the claim is not needed and the skip is not
          # tolerated. That also removes the last github.actor comparison here
          # (zizmor bot-conditions).
          #
          # A SKIPPED guard otherwise means no check ran, which is also the
          # fork case: a fork cannot reach PRIVATE_NAME_GUARD_TOKEN, so the
          # guard fails closed and a maintainer re-runs it from a branch in
          # this repository. This aggregate is the only context the org ruleset
          # watches, so anything tolerated here is tolerated at merge.
          #
          # See resq-software/.github#92.
          case "$GUARD/$GUARD_DEPENDABOT" in
            success/skipped)
              echo "ok: private-name-guard=success" ;;
            skipped/success)
              echo "ok: private-name-guard (dependabot)=success" ;;
            success/success)
              echo "ok: both private-name-guard jobs succeeded" ;;
            *)
              echo "::error::private-name-guard=$GUARD," \
                   "private-name-guard-dependabot=$GUARD_DEPENDABOT;" \
                   "exactly one must have run and it must have succeeded"
              exit 1 ;;
          esac
          exit "$fail"
