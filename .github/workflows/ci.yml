#
# Thin CI wrapper. Dispatches to the org-wide reusable rust-ci workflow
# (fmt + clippy + test + coverage + cargo-deny). Subsumes clippy.yml and
# deny.yml (both removed in the same PR). Security scanning stays in
# security.yml.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: resq-software/.github/.github/workflows/rust-ci.yml@5261ae18b661fcfc4afb4e84b88565d4e7791a7f
    with:
      toolchain: stable
      run-fmt: true
      run-clippy: true
      run-test: true
      run-deny: true
      run-coverage: true
    secrets: inherit # zizmor: ignore[secrets-inherit] — org-internal reusable workflow

  # Guards resq-dsa's headline invariant: zero-dep + no_std. The org reusable
  # rust-ci workflow only builds with std, so an accidental `use std::` or a
  # float method that needs libm would merge green and silently break the crate's
  # value proposition, surfacing only at `cargo publish` or in an embedded
  # consumer. Both checks are `cargo check` (fast, no linking): the host build
  # catches std usage; the bare-metal target proves true core+alloc portability.
  no-std:
    name: resq-dsa no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust + bare-metal target
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - name: resq-dsa compiles without std (host)
        run: cargo check -p resq-dsa --no-default-features
      - name: resq-dsa compiles for bare-metal (core + alloc only)
        run: cargo check -p resq-dsa --no-default-features --target thumbv7em-none-eabi

  # ── Private-name guard ──────────────────────────────────────────────
  # Called from here and not from security.yml: `needs:` cannot reach across
  # workflow files, and the org ruleset watches only the `required` context.
  # A guard that reports into nothing cannot stop a merge, however loudly it
  # fails.
  private-name-guard:
    name: private-name-guard
    # Dependabot's restricted context resolves Actions secrets to empty, so
    # the guard cannot authenticate on its pull requests. The aggregate below
    # tolerates the resulting skip, but only on a pull request Dependabot
    # actually opened.
    #
    # Both halves are tested. github.actor names whoever last triggered the
    # run, so it flips on a re-run and can read `dependabot[bot]` on a pull
    # request Dependabot did not open (zizmor bot-conditions). user.login on
    # the pull_request payload is fixed at trigger time from the original
    # author and cannot be spoofed that way, so the pair is what decides.
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          || github.event.pull_request.user.login != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/private-name-guard.yml@03bd2fc8788be394d96edebcaceb3b3735bb2cbc # main
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [rust, no-std, private-name-guard]
    if: always()
    steps:
      - name: Aggregate
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          NO_STD_RESULT: ${{ needs.no-std.result }}
          GUARD: ${{ needs.private-name-guard.result }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          fail=0
          for pair in "rust=$RUST_RESULT" "no-std=$NO_STD_RESULT"; do
            name="${pair%%=*}"
            res="${pair#*=}"
            case "$res" in
              success|skipped|"") echo "ok: $pair" ;;
              *) echo "::error::$name returned: $res"; fail=1 ;;
            esac
          done
          # The guard is strict: a SKIPPED guard means no check ran, which is
          # also the fork case -- a fork cannot reach PRIVATE_NAME_GUARD_TOKEN,
          # so it fails closed and needs a maintainer to re-run from a branch
          # here. This aggregate is the only context the org ruleset watches,
          # so anything tolerated here is tolerated at merge.
          #
          # A Dependabot pull request is the single allowed skip, for the
          # reason given on the guard job. Tolerating it takes BOTH the
          # triggering actor and the pull request's author: github.actor on
          # its own flips on a re-run and would hand the skip to a
          # human-authored pull request (zizmor bot-conditions).
          if [ "$GUARD" = "success" ]; then
            echo "ok: private-name-guard=success"
          elif [ "$GUARD" = "skipped" ] \
            && [ "$ACTOR" = "dependabot[bot]" ] \
            && [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "ok: private-name-guard skipped on a Dependabot pull request"
          else
            echo "::error::private-name-guard returned: $GUARD"
            exit 1
          fi
          exit "$fail"
