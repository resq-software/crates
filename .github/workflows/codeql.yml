name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

concurrency:
  # Only cancel in-flight runs for PR events (each PR push supersedes
  # its predecessor). On master pushes, every commit must be scanned —
  # cancelling left a chain of unscanned commits when several PRs
  # merged in quick succession (#77, #78, #79, #82 on 2026-05-09 each
  # cancelled the previous master scan before it could upload SARIF).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions-rust-lang' ] # Using actions-rust-lang if available or just 'rust'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: rust
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:rust"

  gitleaks:
    name: Secret Scanning
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        env:
          # Pinned deliberately. Resolving `releases/latest` at run time made
          # this gate depend on an unauthenticated api.github.com call, which
          # is rate-limited on shared runners: a 403 left TAG empty, the
          # download URL 404'd, and `tar` failed the step without a single
          # file having been scanned. Bump this pair together.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)  ARCH=x64;   SHA="$GITLEAKS_SHA256_X64"   ;;
            aarch64) ARCH=arm64; SHA="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac

          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"

          # Verify before extracting: an unverified binary that runs as a
          # security gate is worse than no gate at all.
          echo "${SHA}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks

          ./gitleaks detect --source . --redact -v --config .gitleaks.toml
