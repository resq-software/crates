# ── Crate scope labels (one per crates/* member) ────────────────────────
"crate:resq-ai":
  - changed-files:
    - any-glob-to-any-file: crates/resq-ai/**/*

"crate:resq-bin":
  - changed-files:
    - any-glob-to-any-file: crates/resq-bin/**/*

"crate:resq-clean":
  - changed-files:
    - any-glob-to-any-file: crates/resq-clean/**/*

"crate:resq-cli":
  - changed-files:
    - any-glob-to-any-file: crates/resq-cli/**/*

"crate:resq-dsa":
  - changed-files:
    - any-glob-to-any-file: crates/resq-dsa/**/*

"crate:resq-flame":
  - changed-files:
    - any-glob-to-any-file: crates/resq-flame/**/*

"crate:resq-perf":
  - changed-files:
    - any-glob-to-any-file: crates/resq-perf/**/*

"crate:resq-tui":
  - changed-files:
    - any-glob-to-any-file: crates/resq-tui/**/*

# ── Area labels ─────────────────────────────────────────────────────────
"A-DevOps":
  - changed-files:
    - any-glob-to-any-file: .github/**/*

"A-Examples":
  - changed-files:
    - any-glob-to-any-file: examples/**/*

"A-Config":
  - changed-files:
    - any-glob-to-any-file: config/**/*

"A-Scripts":
  - changed-files:
    - any-glob-to-any-file: scripts/**/*

# ── Category labels ─────────────────────────────────────────────────────
"C-Documentation":
  - changed-files:
    - any-glob-to-any-file: "**/*.md"
    - any-glob-to-any-file: docs/**/*
